# Render Blueprint (plan GRATIS): servicio en Frankfurt (Bybit EU bloquea servidores de EE. UU.).
# Las claves se piden al crear el servicio (sync: false = no están en el repo).
# El plan gratis se duerme sin visitas: .github/workflows/keepalive.yml lo visita cada 10 min.
services:
  - type: web
    name: senales-trading
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BYBIT_ENV
        value: eu
      - key: BYBIT_API_KEY
        sync: false
      - key: BYBIT_API_SECRET
        sync: false
      - key: APP_PIN
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: MAX_LEVERAGE
        value: "4"
